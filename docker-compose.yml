services:
  postgres:
    image: postgres:16-alpine
    container_name: zerohcom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zerohcom
      POSTGRES_PASSWORD: zerohcom_dev
      POSTGRES_DB: zerohcom_development
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerohcom -d zerohcom_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: zerohcom_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: zerohcom
      MONGO_INITDB_ROOT_PASSWORD: zerohcom_dev
      MONGO_INITDB_DATABASE: zerohcom_development
    ports:
      - "27027:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
